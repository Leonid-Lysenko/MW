name: Run Tests

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: diagnostics_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: medic1312
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install -r requirements-dev.txt
        pip install huggingface-hub
    
    - name: Download NER model
      run: |
        python -c "
        from huggingface_hub import snapshot_download
        snapshot_download(
            repo_id='velto006/rubio-ner-finetuned-74',
            local_dir='ml/nlp/models/rubio_ner_finetuned_74',
            local_dir_use_symlinks=False,
            ignore_patterns=['*.pt', 'optimizer-*.pt', 'scheduler.pt', 'rng_state.pth', 'trainer_state.json']
        )
        "
    
    - name: Run black check
      run: |
        cd backend
        black --check .
    
    - name: Run isort check
      run: |
        cd backend
        isort --check-only .
    
    - name: Run tests (skip E2E)
      env:
        DB_NAME: diagnostics_db
        DB_USER: postgres
        DB_PASSWORD: medic1312
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: True
      run: |
        cd backend
        pytest -m "not e2e" --no-cov -k "
            not test_get_ml_symptoms_returns_list and
            not test_knowledge_base_returns_200 and
            not test_knowledge_base_context_data and
            not test_disease_detail_found and
            not test_disease_detail_not_found_in_db
        "